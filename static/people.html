<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Face Blur — Pick people</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <h1>Pick people to blur</h1>
  <div id="analyzing">
    <p id="analyzing-msg">Analyzing…</p>
    <div class="progress"><div id="bar"></div></div>
  </div>
  <div id="picker" style="display:none">
    <p>Tap the people you want blurred.</p>
    <div class="people" id="people"></div>
    <fieldset style="margin:1em 0; border:1px solid #ddd; border-radius:8px;">
      <legend>Blur area</legend>
      <label><input type="radio" name="mode" value="face" checked> Face only</label><br>
      <label><input type="radio" name="mode" value="body_box"> Whole body (fast, rectangle)</label><br>
      <label><input type="radio" name="mode" value="body_silhouette"> Whole body (silhouette — slower, best looking)</label>
    </fieldset>
    <button id="next" disabled>Next</button>
  </div>
  <script type="module">
    import { getPeople, startRender } from "/static/js/api.js?v=4";
    import { subscribe } from "/static/js/progress.js?v=4";
    const jobId = new URLSearchParams(location.search).get("job");
    const selected = new Set();
    let pickerShown = false;

    function render(people) {
      const root = document.getElementById("people");
      root.innerHTML = "";
      for (const p of people) {
        const card = document.createElement("div");
        card.className = "person";
        card.dataset.id = p.id;
        card.innerHTML = `<img src="${p.thumb_url}" alt=""><div class="label">${Math.round(p.first_seen_sec)}s · ${p.frame_count}f</div>`;
        card.addEventListener("click", () => {
          if (selected.has(p.id)) { selected.delete(p.id); card.classList.remove("selected"); }
          else { selected.add(p.id); card.classList.add("selected"); }
          document.getElementById("next").disabled = selected.size === 0;
        });
        root.appendChild(card);
      }
    }

    async function showPicker() {
      if (pickerShown) return;   // idempotent: poll + WS may both fire this
      pickerShown = true;
      const { people } = await getPeople(jobId);
      document.getElementById("analyzing").style.display = "none";
      document.getElementById("picker").style.display = "block";
      render(people);
    }

    subscribe(jobId, (ev) => {
      const bar = document.getElementById("bar");
      const msg = document.getElementById("analyzing-msg");
      if (ev.phase === "downloading") {
        msg.textContent = "Downloading video…";
        if (typeof ev.progress === "number") bar.style.width = (ev.progress * 100).toFixed(1) + "%";
      } else if (ev.phase === "analyzing") {
        msg.textContent = "Analyzing…";
        if (typeof ev.progress === "number") bar.style.width = (ev.progress * 100).toFixed(1) + "%";
      } else if (ev.phase === "awaiting_selection") {
        showPicker();
      } else if (ev.phase === "error") {
        msg.textContent = "Error: " + (ev.message || "");
      }
    });

    document.getElementById("next").addEventListener("click", async () => {
      const mode = document.querySelector('input[name=mode]:checked').value;
      await startRender(jobId, [...selected], mode);
      location.href = `/static/processing.html?job=${jobId}`;
    });
  </script>
</body>
</html>
