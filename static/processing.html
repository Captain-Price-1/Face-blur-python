<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Face Blur — Processing</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <h1 id="title">Processing…</h1>
  <div class="progress"><div id="bar"></div></div>
  <p id="msg">Working on your video.</p>
  <script type="module">
    import { subscribe } from "/static/js/progress.js?v=3";
    const jobId = new URLSearchParams(location.search).get("job");
    const title = document.getElementById("title");
    const bar = document.getElementById("bar");
    const msg = document.getElementById("msg");
    let navigated = false;

    const labels = {
      downloading: ["Downloading…", "Fetching the video."],
      analyzing:   ["Analyzing…", "Finding faces."],
      blurring:    ["Blurring…", "Blurring every face in one pass."],
      rendering:   ["Rendering…", "Applying blur to the selected people."],
    };

    subscribe(jobId, (ev) => {
      const label = labels[ev.phase];
      if (label) {
        title.textContent = label[0];
        msg.textContent = label[1];
        if (typeof ev.progress === "number") bar.style.width = (ev.progress * 100).toFixed(1) + "%";
      } else if (ev.phase === "done") {
        if (navigated) return;
        navigated = true;
        location.href = `/static/done.html?job=${jobId}`;
      } else if (ev.phase === "error") {
        msg.textContent = "Error: " + (ev.message || "");
      }
    });
  </script>
</body>
</html>
