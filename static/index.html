<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Face Blur — Upload</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <h1>Face Blur</h1>
  <p>Give us a video — by file or by link. We'll detect faces, you pick whose to blur, and we'll give you back a new file.</p>

  <section>
    <h2>Upload a file</h2>
    <input type="file" id="file" accept="video/*">
    <button id="upload" disabled>Upload</button>
  </section>

  <p style="text-align:center; color:#999; margin:1.5em 0;">— or —</p>

  <section>
    <h2>Paste a video link</h2>
    <p style="font-size:0.9em; color:#666;">YouTube and most video sites. Downloaded at up to 720p.</p>
    <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=…" style="width:100%; padding:0.6em; font-size:1em;">
    <button id="fetch" style="margin-top:0.6em;" disabled>Fetch &amp; analyze</button>
  </section>

  <div id="status" style="margin-top:1em;"></div>

  <script type="module">
    import { uploadVideo, createJobFromUrl } from "/static/js/api.js";
    const fileEl = document.getElementById("file");
    const uploadBtn = document.getElementById("upload");
    const urlEl = document.getElementById("url");
    const fetchBtn = document.getElementById("fetch");
    const status = document.getElementById("status");

    fileEl.addEventListener("change", () => { uploadBtn.disabled = !fileEl.files.length; });
    urlEl.addEventListener("input", () => { fetchBtn.disabled = !urlEl.value.trim(); });

    uploadBtn.addEventListener("click", async () => {
      uploadBtn.disabled = true;
      status.textContent = "Uploading…";
      try {
        const { job_id } = await uploadVideo(fileEl.files[0]);
        location.href = `/static/people.html?job=${job_id}`;
      } catch (e) {
        status.textContent = "Error: " + e.message;
        uploadBtn.disabled = false;
      }
    });

    fetchBtn.addEventListener("click", async () => {
      fetchBtn.disabled = true;
      status.textContent = "Starting download…";
      try {
        const { job_id } = await createJobFromUrl(urlEl.value.trim());
        location.href = `/static/people.html?job=${job_id}`;
      } catch (e) {
        status.textContent = "Error: " + e.message;
        fetchBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
